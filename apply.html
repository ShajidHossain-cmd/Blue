<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="author" content="Kasorn Leelapisuth" />
    <title>CogniTech — Apply</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/styles/styles.css" />
    <link rel="stylesheet" href="styles/apply.css" />
  </head>

  <body>
    <!-- Navigation section  -->
    <nav>
      <a href="/index.html">
        <img
          width="90"
          height="90"
          src="styles/images/CogniTech_Logo.png"
          alt="logo"
        />
        <!-- remember to remove  the css -->
      </a>
      <!-- Checkbox for menu toggle reference
        "https://www.w3schools.com/howto/howto_js_topnav_responsive.asp"
       and the on click  work around for the hamburger menu from
      " https://css-tricks.com/the-checkbox-hack/" 
       
      -->
      <input type="checkbox" id="menu-toggle" class="menu-toggle" />

      <!-- Hamburger icon -->
      <label for="menu-toggle" class="menu-icon">&#9776;</label>
      <ul>
        <li><a href="/index.html">Home</a></li>
        <li><a href="/jobs.html">Jobs</a></li>
        <li><a href="/apply.html">Apply</a></li>
        <li><a href="/about.html">About</a></li>
        <li><a href="/enhancements.html">Enhancements</a></li>
      </ul>
    </nav>
    <section id="Apply">
      <form
        method="post"
        action="https://mercury.swin.edu.au/it000000/formtest.php"
      >
        <h1>Application</h1>
        <fieldset>
          <p>
            <label for="Job_Reference_Numbers">Job Reference Numbers</label>
            <input
              type="text"
              id="Job_Reference_Numbers"
              name="Job_Reference_Numbers"
              maxlength="5"
              size="15"
              required
              pattern="[A-Za-z0-9]{5}"
            />
          </p>
        </fieldset>
        <fieldset>
          <legend>Name</legend>
          <p>
            <label for="first_name">First Name</label>
            <input
              type="text"
              name="first_name"
              id="first_name"
              maxlength="20"
              size="20"
              required
            />

            <label for="family_name">Family Name</label>
            <input
              type="text"
              name="family_name"
              id="family_name"
              maxlength="20"
              size="20"
              required
            />
          </p>
        </fieldset>

        <label for="Birthday">Date of Birth</label>
        <input type="date" id="Birthday" name="Birthday" required />

        <fieldset>
          <legend>Gender</legend>
          <p>
            <input type="radio" id="male" name="Gender" value="male" required />
            <label for="male">Male</label>

            <input type="radio" id="female" name="Gender" value="female" />
            <label for="female">Female</label>

            <input type="radio" id="other" name="Gender" value="other" />
            <label for="other">Other</label>
          </p>
        </fieldset>

        <fieldset>
          <legend>Address & Contact Details</legend>
          <p>
            <label for="street">Street Address</label>
            <input
              type="text"
              name="street"
              id="street"
              maxlength="40"
              size="20"
              required
            />

            <label for="sub_tw">Suburb/Town</label>
            <input
              type="text"
              name="sub_tw"
              id="sub_tw"
              maxlength="40"
              size="20"
              required
            />
          </p>
          <p>
            <label for="state">State</label>
            <select name="state" id="state" required>
              <option value="" disabled selected>Select</option>
              <option value="VIC">VIC</option>
              <option value="NSW">NSW</option>
              <option value="QLD">QLD</option>
              <option value="NT">NT</option>
              <option value="WA">WA</option>
              <option value="SA">SA</option>
              <option value="TAS">TAS</option>
              <option value="ACT">ACT</option>
            </select>
          </p>

          <label for="postcode">Postcode</label>
          <input
            type="text"
            id="postcode"
            name="postcode"
            required
            pattern="[0-9]{4}"
            maxlength="4"
          />

          <br /><br />
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required />

          <br /><br />
          <label for="phone">Phone number</label>
          <input
            type="text"
            id="phone"
            name="phone"
            required
            pattern="[0-9]{8,12}"
            title="Please enter 8 to 12 digits or spaces only"
            maxlength="12"
          />
        </fieldset>

        <fieldset>
          <legend>Skills</legend>
          <p class="checkbox-group">
            <input type="checkbox" id="html" name="Skills" value="html" />
            <label for="html">HTML</label>

            <input type="checkbox" id="css" name="Skills" value="css" />
            <label for="css">CSS</label>

            <input
              type="checkbox"
              id="javascript"
              name="Skills"
              value="javascript"
            />
            <label for="javascript">JavaScript</label>

            <input
              type="checkbox"
              id="otherSkills"
              name="Skills"
              value="otherSkills"
            />
            <label for="otherSkills">Other</label>
          </p>
        </fieldset>

        <fieldset>
          <label for="otherSkillsText">Other Skills</label>
          <textarea
            id="otherSkillsText"
            name="otherSkillsText"
            rows="4"
            cols="40"
          ></textarea>
        </fieldset>

        <p>
          <input type="submit" value="Apply" />
        </p>
      </form>
    </section>

    <footer>
      <p>&copy; 2025 Tech Careers Australia | All rights reserved.</p>
      <p>Sources: Google Scholar, ACM Digital Library, TechCrunch</p>
    </footer>
  </body>
</html>
